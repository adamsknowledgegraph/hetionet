<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Abstract disease graph with grain texture">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.45"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="core" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#00ffd1"/>
      <stop offset="0.18" stop-color="#00ffd1" stop-opacity="0.48"/>
      <stop offset="0.48" stop-color="#ff3d7f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff36d" stop-opacity="0.85"/>
      <stop offset="0.42" stop-color="#00ffd1" stop-opacity="0.72"/>
      <stop offset="0.7" stop-color="#ff3d7f" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="720" fill="#101010"/>
  <g filter="url(#grain)">
    <rect width="960" height="720" fill="#101010"/>
    <circle cx="508" cy="352" r="318" fill="url(#core)"/>
    <path d="M125 354c112-169 249-238 411-207 158 30 250 126 277 286" fill="none" stroke="#f4f1ea" stroke-opacity="0.13" stroke-width="1.5"/>
    <path d="M140 438c141-196 326-255 554-177" fill="none" stroke="#00ffd1" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M179 502c121-108 250-159 386-153 111 5 191 40 242 105" fill="none" stroke="#ff3d7f" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M243 174c158 108 310 193 456 254" fill="none" stroke="#fff36d" stroke-opacity="0.18" stroke-width="2"/>
    <g filter="url(#blurGlow)">
      <circle cx="494" cy="354" r="38" fill="#fff36d"/>
      <circle cx="494" cy="354" r="14" fill="#101010"/>
      <circle cx="252" cy="445" r="24" fill="#00ffd1"/>
      <circle cx="309" cy="390" r="17" fill="#00ffd1"/>
      <circle cx="732" cy="260" r="24" fill="#fff36d"/>
      <circle cx="776" cy="302" r="17" fill="#fff36d"/>
      <circle cx="724" cy="478" r="22" fill="#ff3d7f"/>
      <circle cx="790" cy="436" r="17" fill="#ff3d7f"/>
      <circle cx="386" cy="586" r="18" fill="#7b5cff"/>
      <circle cx="585" cy="605" r="18" fill="#7b5cff"/>
      <circle cx="836" cy="371" r="21" fill="#ff8abd"/>
    </g>
    <g stroke-width="1.25" stroke-linecap="round">
      <path d="M494 354 252 445" stroke="#00ffd1" stroke-opacity="0.45"/>
      <path d="M494 354 309 390" stroke="#00ffd1" stroke-opacity="0.35"/>
      <path d="M494 354 732 260" stroke="#fff36d" stroke-opacity="0.38"/>
      <path d="M494 354 776 302" stroke="#fff36d" stroke-opacity="0.28"/>
      <path d="M494 354 724 478" stroke="#ff3d7f" stroke-opacity="0.42"/>
      <path d="M494 354 790 436" stroke="#ff3d7f" stroke-opacity="0.32"/>
      <path d="M494 354 386 586" stroke="#7b5cff" stroke-opacity="0.34"/>
      <path d="M494 354 585 605" stroke="#7b5cff" stroke-opacity="0.3"/>
      <path d="M494 354 836 371" stroke="#ff8abd" stroke-opacity="0.35"/>
    </g>
    <g fill="#f4f1ea" fill-opacity="0.9" font-family="DM Mono, monospace" font-size="16">
      <text x="78" y="92">DISEASE ATLAS</text>
      <text x="78" y="118" fill="#00ffd1">SOURCE-BACKED GRAPH</text>
      <text x="652" y="626" fill="#fff36d">1,713 CLAIMS</text>
      <text x="652" y="652" fill="#ff8abd">23 SOURCES</text>
    </g>
  </g>
</svg>
